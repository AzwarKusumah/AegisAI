services:
  postgres:
    image: postgres:17-alpine
    container_name: aegisai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisai
      POSTGRES_USER: aegisai
      POSTGRES_PASSWORD: change-this-local-development-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aegisai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisai -d aegisai"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  aegisai_postgres:
