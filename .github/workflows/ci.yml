name: CI
on:
  push:
  pull_request:

jobs:
  rust-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo test

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: go test ./...

  setup-tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployments/setup
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" ./cmd/aegisai-setup

  detection-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,documents]"
      - run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:packages

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  deploy-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deployments/install.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/control-plane/Dockerfile
          push: false
          tags: aegisai/control-plane:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          tags: aegisai/dashboard:ci
