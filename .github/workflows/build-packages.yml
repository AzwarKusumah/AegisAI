name: Build endpoint and browser packages

on:
  push:
    branches: [main, feat/platform-foundation-rust-agent]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-packages:
    name: Package Chromium and Firefox extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and verify both browsers
        working-directory: apps/extension
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npm run test:packages
      - name: Create installable ZIP packages and checksums
        working-directory: apps/extension
        run: |
          mkdir -p release-assets
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib

          root = Path("dist")
          out = Path("release-assets")
          for browser in ("chromium", "firefox"):
              source = root / browser
              archive = out / f"aegisai-extension-{browser}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as zf:
                  for item in sorted(source.rglob("*")):
                      if item.is_file():
                          zf.write(item, item.relative_to(source))
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              (out / f"{archive.name}.sha256").write_text(f"{digest}  {archive.name}\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-extensions
          path: |
            apps/extension/release-assets/*.zip
            apps/extension/release-assets/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  agent-binaries:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            extension: exe
            archive: zip
          - package: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            extension: ""
            archive: tar.gz
          - package: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            extension: ""
            archive: tar.gz
          - package: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            extension: ""
            archive: tar.gz
          - package: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
            extension: ""
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compile optimized endpoint agent
        working-directory: agent/rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check installer syntax
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: bash -n agent/rust/installers/install-unix.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Get-Content agent/rust/installers/install-windows.ps1 -Raw
          [void][scriptblock]::Create($script)
          $guiScript = Get-Content agent/rust/installers/install-windows-gui.ps1 -Raw
          [void][scriptblock]::Create($guiScript)
      - name: Assemble endpoint package
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          BINARY_EXTENSION: ${{ matrix.extension }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          bundle="release-package/aegisai-agent-$PACKAGE_NAME"
          mkdir -p "$bundle/engine"
          binary="agent/rust/target/$TARGET/release/aegisai-agent"
          if [[ -n "$BINARY_EXTENSION" ]]; then binary="$binary.${BINARY_EXTENSION}"; fi
          test -f "$binary"
          install -m 0755 "$binary" "$bundle/aegisai-agent${BINARY_EXTENSION:+.${BINARY_EXTENSION}}"
          cp -R engine/aegis_inspector "$bundle/engine/"
          cp engine/pyproject.toml "$bundle/engine/pyproject.toml"
          cp agent/rust/installers/README.md "$bundle/README.md"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp agent/rust/installers/install-windows.ps1 "$bundle/install-windows.ps1"
            cp agent/rust/installers/install-windows-gui.ps1 "$bundle/install-windows-gui.ps1"
          else
            cp agent/rust/installers/install-unix.sh "$bundle/install-unix.sh"
            chmod 0755 "$bundle/install-unix.sh"
          fi
          mkdir -p release-assets
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            python - "$bundle" "release-assets/aegisai-agent-$PACKAGE_NAME.zip" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import sys
          source, archive = Path(sys.argv[1]), Path(sys.argv[2])
          with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(source.rglob("*")):
                  if item.is_file():
                      zf.write(item, item.relative_to(source.parent))
          PY
          else
            tar -czf "release-assets/aegisai-agent-$PACKAGE_NAME.tar.gz" -C release-package "$(basename "$bundle")"
          fi
          python - "release-assets" <<'PY'
          from pathlib import Path
          import hashlib, sys
          folder = Path(sys.argv[1])
          for archive in sorted(folder.iterdir()):
              if archive.is_file() and (archive.suffix == ".zip" or archive.name.endswith(".tar.gz")):
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  (folder / (archive.name + ".sha256")).write_text(f"{digest}  {archive.name}\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-agent-${{ matrix.package }}
          path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  setup-cli:
    name: Build ${{ matrix.package }} setup TUI
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: windows-x86_64
            goos: windows
            goarch: amd64
            suffix: .exe
          - package: linux-x86_64
            goos: linux
            goarch: amd64
            suffix: ""
          - package: linux-aarch64
            goos: linux
            goarch: arm64
            suffix: ""
          - package: macos-x86_64
            goos: darwin
            goarch: amd64
            suffix: ""
          - package: macos-aarch64
            goos: darwin
            goarch: arm64
            suffix: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
      - name: Test setup utility
        working-directory: deployments/setup
        run: |
          go mod tidy
          go test ./...
          go vet ./...
      - name: Cross-compile setup binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PACKAGE_NAME: ${{ matrix.package }}
          FILE_SUFFIX: ${{ matrix.suffix }}
        working-directory: deployments/setup
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          output="$GITHUB_WORKSPACE/release-assets/aegisai-setup-$PACKAGE_NAME$FILE_SUFFIX"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=0.4.0" -o "$output" ./cmd/aegisai-setup
          cd "$GITHUB_WORKSPACE/release-assets"
          sha256sum "$(basename "$output")" > "$(basename "$output").sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-setup-${{ matrix.package }}
          path: |
            release-assets/aegisai-setup-*
            release-assets/aegisai-setup-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-self-contained-installer:
    name: Build single-file Windows installer
    needs: [extension-packages, agent-binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: release-agent-windows-x86_64
          path: ${{ runner.temp }}/agent-artifact
      - uses: actions/download-artifact@v8
        with:
          name: release-extensions
          path: ${{ runner.temp }}/extension-artifact
      - name: Assemble self-contained installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "aegisai-installer-payload"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $agentArchive = Get-ChildItem (Join-Path $env:RUNNER_TEMP "agent-artifact") -Filter "*.zip" -File -Recurse | Select-Object -First 1
          if (-not $agentArchive) { throw "Windows Agent artifact ZIP was not found." }
          $agentExtract = Join-Path $env:RUNNER_TEMP "agent-extracted"
          Expand-Archive -LiteralPath $agentArchive.FullName -DestinationPath $agentExtract -Force
          $agentExe = Get-ChildItem $agentExtract -Filter "aegisai-agent.exe" -File -Recurse | Select-Object -First 1
          if (-not $agentExe) { throw "aegisai-agent.exe was not found in the endpoint artifact." }
          Copy-Item $agentExe.FullName (Join-Path $stage "aegisai-agent.exe")
          $engine = Join-Path $agentExe.Directory.FullName "engine"
          if (-not (Test-Path (Join-Path $engine "aegis_inspector"))) { throw "The local inspection engine was not found." }
          Copy-Item $engine (Join-Path $stage "engine") -Recurse

          $extensionArchive = Get-ChildItem (Join-Path $env:RUNNER_TEMP "extension-artifact") -Filter "aegisai-extension-chromium.zip" -File -Recurse | Select-Object -First 1
          if (-not $extensionArchive) { throw "Chromium extension package was not found." }
          $extensionDestination = Join-Path $stage "extension/chromium"
          New-Item -ItemType Directory -Force -Path $extensionDestination | Out-Null
          Expand-Archive -LiteralPath $extensionArchive.FullName -DestinationPath $extensionDestination -Force
          if (-not (Test-Path (Join-Path $extensionDestination "manifest.json"))) { throw "The Chromium extension manifest is missing." }

          $pythonVersion = (python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          $pythonRoot = Join-Path $stage "python"
          New-Item -ItemType Directory -Force -Path $pythonRoot | Out-Null
          $pythonZip = Join-Path $env:RUNNER_TEMP "python-embed-amd64.zip"
          $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
          Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonZip
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonRoot -Force
          $sitePackages = Join-Path $pythonRoot "Lib/site-packages"
          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
          python -m pip install --disable-pip-version-check --no-warn-script-location --target $sitePackages "pypdf>=5,<6" "python-docx>=1.1,<2" "openpyxl>=3.1,<4"
          $pth = Get-ChildItem $pythonRoot -Filter "*._pth" -File | Select-Object -First 1
          if (-not $pth) { throw "Embedded Python path configuration was not found." }
          @("python312.zip", ".", "Lib\site-packages", "..\engine", "import site") | Set-Content -LiteralPath $pth.FullName -Encoding Ascii
          if (-not (Test-Path (Join-Path $pythonRoot "python.exe"))) { throw "Embedded Python executable is missing." }

          $bundleDir = "agent/windows-installer/bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $bundleZip = Join-Path $bundleDir "installer-bundle.zip"
          Remove-Item $bundleZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $bundleZip -CompressionLevel Optimal
          Write-Host "Self-contained payload prepared: $((Get-Item $bundleZip).Length) bytes"
      - name: Publish single-file Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish agent/windows-installer/AegisAI.Installer.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/aegisai-installer-release" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "$env:RUNNER_TEMP/aegisai-installer-release/AegisAI-Installer.exe" "release-assets/AegisAI-Installer-Windows-x86_64.exe"
          $hash = (Get-FileHash "release-assets/AegisAI-Installer-Windows-x86_64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AegisAI-Installer-Windows-x86_64.exe" | Set-Content "release-assets/AegisAI-Installer-Windows-x86_64.exe.sha256" -Encoding Ascii
      - uses: actions/upload-artifact@v7
        with:
          name: release-installer-windows
          path: |
            release-assets/AegisAI-Installer-Windows-x86_64.exe
            release-assets/AegisAI-Installer-Windows-x86_64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension-packages, agent-binaries, setup-cli, windows-self-contained-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --generate-notes --title "$TAG_NAME"
          fi
