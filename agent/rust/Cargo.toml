[package]
name = "aegisai-agent"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "AegisAI cross-platform Native Messaging endpoint agent"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
whoami = "1.5"
zeroize = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
